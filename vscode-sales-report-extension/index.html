<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>松下冰箱官方旗舰店 · BI经营日报</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root{
      --page-bg: #F5F6FA; --header-bg: #1a1a2e;
      --card-bg: #fff; --card-radius: 12px;
      --card-shadow: 0 1px 8px rgba(0,0,0,.06);
      --font-main: "Microsoft YaHei","PingFang SC",sans-serif;
      --primary: #2F6BFF; --success: #28C76F;
      --warning: #FF9F43; --danger: #EA5455; --accent: #7367F0;
      --muted: #6E7191; --text: #1e1e2e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:var(--font-main);background:var(--page-bg);color:var(--text);}
    .app-header{
      background:linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color:#fff;padding:16px 28px;box-shadow:0 2px 12px rgba(0,0,0,0.15);
    }
    .header-inner{max-width:1400px;margin:0 auto;display:flex;gap:16px;align-items:center;}
    .brand-logo{
      width:44px;height:44px;border-radius:10px;
      background:linear-gradient(135deg,#2F6BFF,#7367F0);
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:18px;color:#fff;flex-shrink:0;
    }
    .brand-text{font-size:17px;font-weight:700;letter-spacing:.5px;}
    .brand-sub{font-size:11px;color:rgba(255,255,255,0.65);margin-top:2px;}
    .header-right{margin-left:auto;text-align:right;}
    .date-pill{
      background:rgba(255,255,255,0.1);padding:6px 14px;
      border-radius:8px;font-weight:600;font-size:14px;display:inline-block;
    }
    .data-note{font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px;}

    .container{max-width:1400px;margin:0 auto;padding:0 20px;}

    /* Metrics Row */
    .metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0;}
    @media(max-width:1200px){.metrics-row{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:768px){.metrics-row{grid-template-columns:repeat(2,1fr);}}
    .metric-card{
      background:var(--card-bg);border-radius:var(--card-radius);
      box-shadow:var(--card-shadow);padding:16px 20px;
      display:flex;align-items:center;gap:14px;transition:transform .2s;
    }
    .metric-card:hover{transform:translateY(-2px);}
    .metric-icon{
      width:42px;height:42px;border-radius:10px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:18px;
    }
    .metric-info .label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
    .metric-info .value{font-size:22px;font-weight:700;color:var(--text);}
    .metric-info .sub{font-size:11px;color:var(--muted);margin-top:2px;}

    /* Funnel Section */
    .section-title{
      font-size:15px;font-weight:700;margin-bottom:12px;
      display:flex;align-items:center;gap:8px;
    }
    .section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--primary);}

    .card-panel{
      background:var(--card-bg);border-radius:var(--card-radius);
      box-shadow:var(--card-shadow);padding:18px 20px;
    }

    /* Grid Layouts */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .grid-3-7{display:grid;grid-template-columns:3fr 7fr;gap:14px;margin-bottom:14px;}
    @media(max-width:1100px){.grid-2,.grid-3-7{grid-template-columns:1fr;}}

    /* Tables */
    .data-table{width:100%;border-collapse:collapse;font-size:12px;}
    .data-table thead th{
      position:sticky;top:0;text-align:left;padding:10px 12px;font-weight:700;
      background:#f8f9fc;border-bottom:2px solid #e8ecf1;font-size:11px;
      color:var(--muted);cursor:pointer;user-select:none;
    }
    .data-table tbody td{padding:9px 12px;border-bottom:1px solid #f0f1f5;}
    .data-table tbody tr:hover{background:rgba(47,107,255,0.03);}
    .table-scroll{max-height:380px;overflow:auto;border-radius:8px;}
    .badge{
      display:inline-block;padding:2px 8px;border-radius:999px;
      font-size:11px;font-weight:700;color:#fff;
    }
    .badge-red{background:#EA5455;}.badge-yellow{background:#FF9F43;}.badge-green{background:#28C76F;}

    /* Insights */
    .insights-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    @media(max-width:900px){.insights-grid{grid-template-columns:1fr;}}
    .insight-item{
      display:flex;gap:10px;padding:10px 12px;border-radius:10px;
      background:#fafbfc;border-left:3px solid transparent;
    }
    .insight-item.lvl-red{border-left-color:#EA5455;background:#fff5f5;}
    .insight-item.lvl-yellow{border-left-color:#FF9F43;background:#fffaf5;}
    .insight-item.lvl-green{border-left-color:#28C76F;background:#f5fff9;}
    .insight-item.lvl-blue{border-left-color:#2F6BFF;background:#f5f8ff;}
    .insight-icon{font-size:14px;flex-shrink:0;margin-top:2px;}
    .insight-body h5{font-size:13px;font-weight:700;margin-bottom:4px;}
    .insight-body p{font-size:12px;color:var(--muted);line-height:1.5;}

    .text-right{text-align:right;}
    .text-muted{color:var(--muted);font-size:12px;}
    .chart-box{min-height:300px;}
    .chart-box-sm{min-height:260px;}

    footer{
      text-align:center;padding:20px 0 30px;color:#a0a4b8;font-size:12px;
    }
  </style>
</head>

          type:'pie', radius:['45%','72%'], center:['50%','48%'],
          avoidLabelOverlap:false, label:{show:false},
          emphasis:{label:{show:true,fontWeight:700,formatter:'{b}\n{d}%'}}, data,
        }],
        color:['#2F6BFF','#7367F0','#28C76F','#FF9F43','#EA5455','#00CFE8','#FF6B6B'],
      });
    }

    // Funnel
    function renderFunnel(){
      const f = reportData.funnel;
      const data = [
        {name:'商品访客', value:f.visitors},
        {name:'下单人数', value:f.order_placers},
        {name:'支付人数', value:f.payers},
        {name:'成团人数', value:f.success_buyers},
      ];
      // 计算转化率标注
      const rates = [
        '',
        f.visitors>0 ? `下单率 ${(f.order_placers/f.visitors*100).toFixed(2)}%` : '',
        f.order_placers>0 ? `支付率 ${(f.payers/f.order_placers*100).toFixed(2)}%` : '',
        f.payers>0 ? `成团率 ${(f.success_buyers/f.payers*100).toFixed(2)}%` : '',
      ];
      charts.funnel.setOption({
        tooltip:{
          trigger:'item',
          formatter:function(p){
            const i = p.dataIndex;
            return `${p.name}: ${p.value}${rates[i] ? '  ('+rates[i]+')' : ''}`;
          }
        },
        series:[{
          type:'funnel', left:'10%', top:10, bottom:10, width:'80%',
          minSize:'18%', gap:3,
          label:{show:true,position:'inside',fontSize:13,fontWeight:600,
            formatter:function(p){const i=p.dataIndex;return p.name+'\n'+p.value+(rates[i]?'  '+rates[i]:'');}
          },
          labelLine:{show:false},
          itemStyle:{borderColor:'#fff',borderWidth:2},
          emphasis:{label:{fontSize:16}}, data,
        }],
        color:['#2F6BFF','#7367F0','#FF9F43','#28C76F'],
      });
    }

    // Trend
    function renderTrend(){
      const t = reportData.trend;
      charts.trend.setOption({
        tooltip:{trigger:'axis'},
        legend:{data:['销售额','访客数'],top:4,textStyle:{fontSize:11}},
        grid:{left:50,right:50,top:40,bottom:30},
        xAxis:{type:'category',data:t.days,boundaryGap:false,axisLabel:{interval:'auto',rotate:30,fontSize:10}},
        yAxis:[
          {type:'value',name:'销售额(¥)',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10,formatter:function(v){return (v/10000).toFixed(0)+'w';}}},
          {type:'value',name:'访客',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},
        ],
        series:[
          {name:'销售额',type:'line',smooth:true,data:t.sales,
           itemStyle:{color:'#2F6BFF'},areaStyle:{color:'rgba(47,107,255,0.08)'},symbol:'none'},
          {name:'访客数',type:'line',smooth:true,data:t.visitors,yAxisIndex:1,
           itemStyle:{color:'#7367F0'},areaStyle:{color:'rgba(115,103,240,0.05)'},symbol:'none'},
        ],
      });
    }

    // Traffic Pie
    function renderTraffic(){
      const data = reportData.traffic.map(t=>({name:t.source, value:t.value}));
      charts.traffic.setOption({
        tooltip:{trigger:'item',formatter:'{b}: {c}单 ({d}%)'},
        legend:{type:'scroll',orient:'vertical',right:10,top:20,bottom:20,textStyle:{fontSize:10}},
        series:[{
          type:'pie',radius:['50%','75%'],center:['40%','50%'],
          avoidLabelOverlap:false,label:{show:false},data,
        }],
        color:['#2F6BFF','#7367F0','#28C76F','#FF9F43','#EA5455','#00CFE8','#FF6B6B','#8B5CF6','#10B981','#F59E0B'],
      });
    }

    // === Tables ===
    function renderCategoryTable(){
      const body = $('categoryBody');
      const totalSales = reportData.category.reduce((s,c)=>s+c.sales_amount,0)||1;
      body.innerHTML = reportData.category.map(c => `
        <tr>
          <td><strong>${c.category}</strong></td>
          <td>${fmt(c.sales_amount)}</td>
          <td>${c.qty}</td>
          <td>${c.orders}</td>
          <td>${fmt(c.refund_amount)}</td>
          <td><span class="badge ${c.refund_rate>0.15?'badge-red':c.refund_rate>0.05?'badge-yellow':'badge-green'}">${pct(c.refund_rate)}</span></td>
          <td>${(c.sales_amount/totalSales*100).toFixed(1)}%</td>
        </tr>
      `).join('');
    }

    function renderProductTable(){
      const body = $('productBody');
      const list = reportData.products.slice(0,10);
      body.innerHTML = list.map((p,i) => `
        <tr>
          <td>${i+1}</td>
          <td title="${p.name}">${p.name.length>25?p.name.slice(0,25)+'...':p.name}</td>
          <td>${p.sku}</td>
          <td>${fmt(p.sales_amount)}</td>
          <td>${p.qty}</td>
          <td>${fmt(p.avg_price)}</td>
          <td><span class="badge ${p.refund_rate>0.15?'badge-red':p.refund_rate>0.05?'badge-yellow':'badge-green'}">${pct(p.refund_rate)}</span></td>
        </tr>
      `).join('');
    }

    // === Insights ===
    function renderInsights(){
      const area = $('insightsArea');
      const iconMap = {red:'🔴', yellow:'🟡', green:'🟢', blue:'🔵'};
      area.innerHTML = reportData.insights.slice(0,12).map(ins => `
        <div class="insight-item lvl-${ins.level}">
          <div class="insight-icon">${iconMap[ins.level]||'🔵'}</div>
          <div class="insight-body">
            <h5>${ins.title}</h5>
            <p>${ins.text}</p>
          </div>
        </div>
      `).join('');
    }

    // === Init ===
    function renderAll(){
      renderMetrics();
      if(!charts.categoryPie) initCharts();
      renderCategoryPie();
      renderFunnel();
      renderTrend();
      renderTraffic();
      renderCategoryTable();
      renderProductTable();
      renderInsights();
    }
    renderAll();
  </script>
</body>
</html>
